version: '3.8'

services:
  # =========================================================================
  # 1. MongoDB Database Service
  # =========================================================================
  mongodb:
    image: mongo:7.0
    container_name: helpdesk-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: helpdesk_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - helpdesk_network

  # =========================================================================
  # 2. Helpdesk Express & WebSocket API Service
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/helpdesk_db
      JWT_SECRET: super_secret_jwt_key_helpdesk_docker_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - helpdesk_network

  # =========================================================================
  # 3. Optional One-Time Database Seeder Service
  # Run with: docker compose run --rm seed
  # =========================================================================
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-seeder
    command: ["node", "seed.js"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/helpdesk_db
      JWT_SECRET: super_secret_jwt_key_helpdesk_docker_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - helpdesk_network
    profiles:
      - tools

volumes:
  mongo_data:
    driver: local

networks:
  helpdesk_network:
    driver: bridge
